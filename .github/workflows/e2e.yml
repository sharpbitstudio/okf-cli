name: e2e

on:
  # Manual trigger (gh workflow run / Actions UI). GitHub only exposes workflow_dispatch
  # once this file is on the default branch.
  workflow_dispatch:
  # A push to any branch of this repository (Dependabot's included) runs these jobs; a PR from a branch of this
  # repository needs no second run for the same SHA.
  push:
    branches:
      - '**'
  # PRs from forks, whose branches are never pushed here: the job-level `if` below skips PRs from
  # branches of this repository (their push run covers them). A fork PR runs with a read-only token and
  # no secrets; never use pull_request_target here.
  pull_request:

# A newer push to the same branch cancels the older, still-running run, except on main, where every
# pushed commit gets its own complete run. Its own group, so it never cancels a `build` run.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

# The launcher (launcher/okfw, launcher/okfw.cmd; docs/launcher.md) on the three runner systems: the whole test suite
# (the hermetic launcher tests run the script under each system's sh: dash, macOS /bin/sh, Git for Windows' sh.exe,
# and okfw.cmd under cmd and PowerShell on Windows) plus `networkTest`, which downloads the published
# 1.0.0-alpha.1 with real curl and runs okfw --verify / --update against it with the runner's gh (on GitHub Actions a
# missing gh or one older than the launcher's floor fails those cases). The GitHub Action (action.yml,
# docs/github-actions.md) runs as `uses: ./` against fixture repositories on the same three systems (with
# verify-provenance on the published release; on ubuntu also release.yml's attestation check of it), and the xcheck
# action (xcheck/action.yml) as `uses: ./xcheck` against a fixture federation on ubuntu. These jobs are not required
# checks.
jobs:
  launcher:
    # A PR from a branch of this repo is covered by that branch's push run, so its pull_request job is skipped (see
    # `if`) and gets another name. The `name` condition must stay the exact negation of `if`.
    # A skipped job has no matrix, so its name names no system.
    name: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && 'Skipped on same-repo PR (see push run) - Launcher' || format('Launcher ({0})', matrix.os) }}
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7
        with:
          # Nothing in this job talks to the remote after the checkout.
          persist-credentials: false

      - name: Set up JDK 25 (Temurin)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.4.1
        with:
          # Validates the checked-in wrapper jar against known-good checksums and caches ~/.gradle.
          validate-wrappers: true
          cache-cleanup: on-success

      - name: Tools on this runner
        shell: bash
        run: |
          java -version
          gh --version || true

      - name: Build + test + network test
        shell: bash
        run: ./gradlew build networkTest --stacktrace

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-launcher-${{ matrix.os }}
          path: |
            build/reports/tests/
            build/test-results/
          retention-days: 7
          if-no-files-found: ignore

  launcher-release-version:
    # A release build: the jar then writes the pin itself (LauncherJarTest asserts by version), so a version-dependent
    # assertion cannot fail first in a release run. Skipped on a same-repo PR as above.
    name: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && 'Skipped on same-repo PR (see push run) - Launcher (release-like version)' || 'Launcher (release-like version)' }}
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK 25 (Temurin)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.4.1
        with:
          validate-wrappers: true
          cache-cleanup: on-success

      - name: shellcheck
        shell: bash
        run: shellcheck -s sh launcher/okfw action/*.sh xcheck/*.sh

      - name: Build + test as a release-like version
        shell: bash
        run: ./gradlew build -Pversion=0.0.0-e2e.1 --stacktrace

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-launcher-release-version
          path: |
            build/reports/tests/
            build/test-results/
          retention-days: 7
          if-no-files-found: ignore

  action:
    # The GitHub Action of this commit (`uses: ./`) against fixture repositories: a bundle `init` wrote with this
    # commit's jar (built as a release-like version, so the pin names it; the cache is seeded with it), clean and with
    # an undocumented code change, and a bundle pinned to the published 1.0.0-alpha.1, which the launcher downloads
    # and checks with okfw --verify (the runner's gh). On ubuntu, release.yml's tokenless attestation check also runs
    # on that release.
    # Explicit inputs keep the cases the same on every event; ImpactArgsTest covers the `auto` selection. One run here
    # leaves base and impact-strict at `auto` on the clean bundle: on a push to main it passes this repository's
    # `before`, which the fixture does not have, so it exercises the CLI's unreachable-base path (a non-strict skip with
    # a warning annotation); on other events it exercises the real selection (a fork PR's base branch is pushed to the
    # fixture's origin for it). Skipped on a same-repo PR as above.
    name: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && 'Skipped on same-repo PR (see push run) - Action' || format('Action ({0})', matrix.os) }}
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Before setup-java: the Java a consumer's job finds on this image without one must be 17 or later.
      - name: Default Java on this image is 17 or later
        shell: bash
        run: |
          echo "JAVA_HOME=${JAVA_HOME-}"
          # The launcher's order: $JAVA_HOME/bin/java when executable, else java on the PATH.
          if [ -n "${JAVA_HOME-}" ] && [ -x "$JAVA_HOME/bin/java" ]; then
            java=$JAVA_HOME/bin/java
          else
            java=java
          fi
          echo "java: $java"
          line=$("$java" -version 2>&1 | head -n 1) || line="no java: $line"
          echo "$line"
          version=$(printf '%s\n' "$line" | sed -n 's/.*version "\([^"]*\)".*/\1/p')
          case $version in 1.*) version=${version#1.} ;; esac
          major=${version%%[!0-9]*}
          echo "major version: ${major:-unknown}"
          test -n "$major" && test "$major" -ge 17

      - name: Set up JDK 25 (Temurin)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.4.1
        with:
          validate-wrappers: true
          cache-cleanup: on-success

      - name: Tools on this runner
        shell: bash
        run: java -version

      - name: Build the all jar as a release-like version
        shell: bash
        run: ./gradlew allJar -Pversion=0.0.0-e2e.1 --stacktrace

      - name: Fixture repositories
        shell: bash
        env:
          # Empty except on a pull request.
          PR_BASE_REF: ${{ github.base_ref }}
        run: |
          set -eu
          jar="$PWD/build/libs/okf-cli-0.0.0-e2e.1-all.jar"
          export GIT_CONFIG_GLOBAL="$RUNNER_TEMP/fixture-gitconfig" GIT_CONFIG_NOSYSTEM=1
          git config --global user.name e2e
          git config --global user.email e2e@example.invalid
          git config --global core.autocrlf false
          git config --global commit.gpgsign false

          # (a) and (b): a bundle written by this commit's `okf init`, with a bare repository as origin (origin/main).
          fixture="$RUNNER_TEMP/fixture"
          git init -q "$fixture"
          git -C "$fixture" symbolic-ref HEAD refs/heads/main
          java -jar "$jar" init "--repo=$fixture"
          mkdir -p "$fixture/src"
          printf 'a\n' > "$fixture/src/a.txt"
          printf '%s\n' '---' 'type: Guide' 'title: "Guide"' 'description: "The fixture code under src/."' \
            'tags: [e2e]' 'code_paths: ["src/**"]' '---' '# Guide' '' 'The code is under `src/`.' > "$fixture/docs/guide.md"
          git -C "$fixture" add -A
          git -C "$fixture" commit -q -m 'Fixture bundle'
          git init -q --bare "$RUNNER_TEMP/fixture-origin.git"
          git -C "$fixture" remote add origin "$RUNNER_TEMP/fixture-origin.git"
          git -C "$fixture" push -q -u origin main
          # On a fork PR the `auto` run below compares with origin/<the PR's base branch>: the fixture's origin gets it.
          if [ -n "$PR_BASE_REF" ]; then
            git -C "$fixture" push -q origin "main:refs/heads/$PR_BASE_REF"
          fi
          # A code change under the guide's code_paths, without a doc update.
          git -C "$fixture" checkout -q -b feature
          printf 'b\n' > "$fixture/src/a.txt"
          git -C "$fixture" commit -q -am 'Change the code only'
          git -C "$fixture" checkout -q main
          cat "$fixture/okf-wrapper.properties"
          # The pinned jar is this build's: no release has it, so the cache holds it.
          cache="$RUNNER_TEMP/okf-cli-cache/okf-cli/0.0.0-e2e.1"
          mkdir -p "$cache"
          cp "$jar" "$cache/okf-cli-0.0.0-e2e.1-all.jar"

          # (c): a bundle pinned to the published 1.0.0-alpha.1, with an okf.yaml that version reads, an origin/main and
          # no cached jar.
          alpha="$RUNNER_TEMP/fixture-alpha1"
          git init -q "$alpha"
          git -C "$alpha" symbolic-ref HEAD refs/heads/main
          printf '%s\n' 'schema_version: 1' 'repo: fixture-alpha1' 'index_language: en' 'index_command: ./okfw index' \
            > "$alpha/okf.yaml"
          mkdir -p "$alpha/docs"
          printf '%s\n' '---' 'okf_version: "0.2"' '---' '# fixture-alpha1 docs' > "$alpha/docs/index.md"
          printf '%s\n' 'version=1.0.0-alpha.1' \
            'sha256=cadfdb7cb0d55e1b615e2662cca6cd48c554463f8c3e212753ceafea0303503b' > "$alpha/okf-wrapper.properties"
          git -C "$alpha" add -A
          git -C "$alpha" commit -q -m 'Fixture pinned to 1.0.0-alpha.1'
          git init -q --bare "$RUNNER_TEMP/fixture-alpha1-origin.git"
          git -C "$alpha" remote add origin "$RUNNER_TEMP/fixture-alpha1-origin.git"
          git -C "$alpha" push -q -u origin main
          rm -rf "$RUNNER_TEMP/okf-cli-cache/okf-cli/1.0.0-alpha.1"

      - name: (a) Action on a clean bundle
        id: clean
        uses: ./
        with:
          repo: ${{ runner.temp }}/fixture
          base: origin/main
          impact-strict: 'true'

      - name: (a) The version output names the pinned version
        shell: bash
        env:
          VERSION: ${{ steps.clean.outputs.version }}
        run: |
          echo "version output: $VERSION"
          test "$VERSION" = 0.0.0-e2e.1

      - name: (a) Action on a clean bundle with base and impact-strict chosen from this event
        uses: ./
        with:
          repo: ${{ runner.temp }}/fixture

      - name: (a) The event names the default branch
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          echo "default branch: $DEFAULT_BRANCH"
          test -n "$DEFAULT_BRANCH"

      - name: (b) Check out the undocumented code change
        shell: bash
        run: git -C "$RUNNER_TEMP/fixture" checkout -q feature

      - name: (b) Action on the undocumented code change
        id: undocumented
        continue-on-error: true
        uses: ./
        with:
          repo: ${{ runner.temp }}/fixture
          base: origin/main
          impact-strict: 'true'

      - name: (b) Action on the undocumented code change, impact findings as warnings
        id: lenient
        continue-on-error: true
        uses: ./
        with:
          repo: ${{ runner.temp }}/fixture
          base: origin/main
          impact-strict: 'false'

      - name: (b) The action failed only because of strictness
        shell: bash
        env:
          STRICT: ${{ steps.undocumented.outcome }}
          LENIENT: ${{ steps.lenient.outcome }}
        run: |
          echo "impact-strict true: $STRICT, impact-strict false: $LENIENT"
          test "$STRICT" = failure
          test "$LENIENT" = success

      - name: (c) Action on a bundle pinned to 1.0.0-alpha.1 (downloads the release; okfw --verify, check and impact)
        id: alpha
        uses: ./
        with:
          repo: ${{ runner.temp }}/fixture-alpha1
          base: origin/main
          impact-strict: 'true'
          verify-provenance: 'true'

      - name: (c) The version output names the pinned release, which is now in the cache
        shell: bash
        env:
          VERSION: ${{ steps.alpha.outputs.version }}
        run: |
          echo "version output: $VERSION"
          test "$VERSION" = 1.0.0-alpha.1
          test -f "$RUNNER_TEMP/okf-cli-cache/okf-cli/1.0.0-alpha.1/okf-cli-1.0.0-alpha.1-all.jar"

      # The command of release.yml's "Verify the attestation" (keep the two in step), tokenless and with the runner's
      # gh as in a release run, on the published 1.0.0-alpha.1 and its Sigstore bundle: it passes with the commit that
      # release was built from and fails with another commit. Once, on ubuntu.
      - name: (c) The release workflow's attestation check on 1.0.0-alpha.1
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          VERSION=1.0.0-alpha.1
          cd "$(mktemp -d "$RUNNER_TEMP/release-verify.XXXXXX")"
          for file in "okf-cli-$VERSION-all.jar" "okf-cli-$VERSION-all.jar.sha256" "okf-cli-$VERSION-all.jar.sigstore.json"; do
            curl -q -fsSLO "https://github.com/sharpbitstudio/okf-cli/releases/download/v$VERSION/$file"
          done
          sha256sum -c "okf-cli-$VERSION-all.jar.sha256"
          # $1: the commit the attestation must name as its source.
          release_verify() {
            GH_CONFIG="$(mktemp -d "$RUNNER_TEMP/gh-config.XXXXXX")"
            env -u GH_TOKEN -u GITHUB_TOKEN -u GH_ENTERPRISE_TOKEN -u GITHUB_ENTERPRISE_TOKEN -u GH_HOST \
              GH_CONFIG_DIR="$GH_CONFIG" GH_NO_UPDATE_NOTIFIER=1 GH_PROMPT_DISABLED=1 \
              gh attestation verify "okf-cli-$VERSION-all.jar" --bundle "okf-cli-$VERSION-all.jar.sigstore.json" \
              --repo sharpbitstudio/okf-cli \
              --predicate-type https://slsa.dev/provenance/v1 \
              --cert-identity https://github.com/sharpbitstudio/okf-cli/.github/workflows/release.yml@refs/heads/main \
              --source-ref refs/heads/main --deny-self-hosted-runners \
              --source-digest "$1"
          }
          gh --version
          release_verify c484ae24411600e2990a6d7e20cf554edb6ea695
          # Control: the parent of that commit. gh's output stays in the log, so its reason can be read there.
          echo "Control, expected to fail with a source digest mismatch:"
          if release_verify 8e0ff3b0f81b643687833a0a14d732aae5854994; then
            echo "::error::the attestation check passed with a commit the release was not built from"
            exit 1
          fi

  xcheck-action:
    # The xcheck action of this commit (`uses: ./xcheck`) against a fixture federation: a hub written by this commit's
    # `okf init` (the jar built as a release-like version, so the pin names it; the cache is seeded with it) and two
    # satellites already in the workspace, so `satellites: ''` clones nothing; clean, then with a broken cross-repo
    # reference. A last run clones this repository anonymously (`token: ''`) into an empty workspace: the clone
    # settings (credential helpers off, no prompts) must not get in the way of a public clone, and okf xcheck then
    # stops with a setup error (exit 2), since the hub's satellites are not there. The token path itself is covered by
    # XcheckActionTest (Basic auth over local HTTP). Skipped on a same-repo PR as above.
    name: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && 'Skipped on same-repo PR (see push run) - xcheck action' || 'xcheck action' }}
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK 25 (Temurin)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.4.1
        with:
          validate-wrappers: true
          cache-cleanup: on-success

      - name: Build the all jar as a release-like version
        shell: bash
        run: ./gradlew allJar -Pversion=0.0.0-e2e.1 --stacktrace

      - name: Fixture federation
        shell: bash
        run: |
          set -eu
          jar="$PWD/build/libs/okf-cli-0.0.0-e2e.1-all.jar"
          export GIT_CONFIG_GLOBAL="$RUNNER_TEMP/fixture-gitconfig" GIT_CONFIG_NOSYSTEM=1
          : > "$GIT_CONFIG_GLOBAL"
          commit() {
            git -C "$1" add -A
            git -C "$1" -c user.name=e2e -c user.email=e2e@example.invalid -c commit.gpgsign=false commit -q -m "$2"
          }

          # The hub: okf init with this commit's jar (okf.yaml, the docs root, the launcher and a pin naming the jar),
          # then its satellites and a Feature Record that lists them.
          hub="$RUNNER_TEMP/xcheck-hub"
          git init -q -b main "$hub"
          java -jar "$jar" init "--repo=$hub" --name=hub-repo
          printf '%s\n' 'external_repos: [sat-a, sat-b]' 'satellites:' \
            '  - repo: sat-a' '    description: Satellite A' '    index: https://example.invalid/sat-a/blob/main/docs/index.md' \
            '  - repo: sat-b' '    description: Satellite B' '    index: https://example.invalid/sat-b/blob/main/docs/index.md' \
            >> "$hub/okf.yaml"
          mkdir -p "$hub/docs/features"
          printf '%s\n' '---' 'type: Feature Record' 'title: "Invite"' 'repos: [sat-a, sat-b]' 'code_paths: []' '---' \
            '# Invite' '' 'See `sat-a/docs/index.md`.' > "$hub/docs/features/invite.md"
          commit "$hub" 'Fixture hub'
          cat "$hub/okf.yaml" "$hub/okf-wrapper.properties"

          # The satellites, already in the workspace.
          workspace="$RUNNER_TEMP/xcheck-workspace"
          for sat in sat-a sat-b; do
            git init -q -b main "$workspace/$sat"
            printf '%s\n' 'schema_version: 1' "repo: $sat" 'hub_repo: hub-repo' 'external_repos: [hub-repo]' \
              > "$workspace/$sat/okf.yaml"
            mkdir -p "$workspace/$sat/docs"
            printf '%s\n' '---' 'okf_version: "0.2"' '---' "# $sat" > "$workspace/$sat/docs/index.md"
            printf '%s\n' '---' 'type: Satellite Note' 'hub: features/invite' 'code_paths: []' '---' '# Note' '' \
              'See `hub-repo/docs/features/invite.md`.' > "$workspace/$sat/docs/NOTE.md"
            commit "$workspace/$sat" 'Fixture satellite'
          done

          # The pinned jar is this build's: no release has it, so the cache holds it.
          cache="$RUNNER_TEMP/okf-cli-cache/okf-cli/0.0.0-e2e.1"
          mkdir -p "$cache"
          cp "$jar" "$cache/okf-cli-0.0.0-e2e.1-all.jar"

      - name: Clean federation (satellites already in the workspace)
        id: clean
        uses: ./xcheck
        with:
          hub: ${{ runner.temp }}/xcheck-hub
          satellites: ''
          workspace: ${{ runner.temp }}/xcheck-workspace

      - name: The clean run's outputs - exit code 0, no report
        shell: bash
        env:
          EXIT_CODE: ${{ steps.clean.outputs.exit-code }}
          REPORT: ${{ steps.clean.outputs.report }}
        run: |
          echo "exit-code: $EXIT_CODE, report: $REPORT"
          test "$EXIT_CODE" = 0
          test "$REPORT" = "$RUNNER_TEMP/okf-xcheck-report.md"
          test ! -e "$REPORT"

      - name: Break a cross-repo reference in sat-a
        shell: bash
        run: |
          printf '%s\n' '---' 'type: Satellite Note' 'hub: features/invite' 'code_paths: []' '---' '# Note' '' \
            'See `hub-repo/docs/gone.md`.' > "$RUNNER_TEMP/xcheck-workspace/sat-a/docs/NOTE.md"

      - name: Federation with a broken cross-repo reference
        id: broken
        continue-on-error: true
        uses: ./xcheck
        with:
          hub: ${{ runner.temp }}/xcheck-hub
          satellites: ''
          workspace: ${{ runner.temp }}/xcheck-workspace

      - name: The broken run failed with exit code 1 and a report
        shell: bash
        env:
          OUTCOME: ${{ steps.broken.outcome }}
          EXIT_CODE: ${{ steps.broken.outputs.exit-code }}
          REPORT: ${{ steps.broken.outputs.report }}
        run: |
          echo "outcome: $OUTCOME, exit-code: $EXIT_CODE, report: $REPORT"
          test "$OUTCOME" = failure
          test "$EXIT_CODE" = 1
          cat "$REPORT"
          grep -q 'hub-repo/docs/gone.md' "$REPORT"

      - name: Anonymous clone of this public repository
        id: public
        continue-on-error: true
        uses: ./xcheck
        with:
          hub: ${{ runner.temp }}/xcheck-hub
          satellites: ${{ github.repository }}
          token: ''
          workspace: ${{ runner.temp }}/xcheck-public

      - name: The public clone succeeded, then okf xcheck found the hub's satellites missing
        shell: bash
        env:
          OUTCOME: ${{ steps.public.outcome }}
          EXIT_CODE: ${{ steps.public.outputs.exit-code }}
          REPOSITORY: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          echo "outcome: $OUTCOME, exit-code: $EXIT_CODE"
          test "$OUTCOME" = failure
          # Set only once okf xcheck ran, so the clone succeeded.
          test "$EXIT_CODE" = 2
          clone="$RUNNER_TEMP/xcheck-public/${REPOSITORY#*/}"
          test "$(git -C "$clone" remote get-url origin)" = "$SERVER_URL/$REPOSITORY.git"
          test "$(git -C "$clone" rev-parse --is-shallow-repository)" = false
          test -z "$(git -C "$clone" tag)"
          ! grep -Eiq 'extraheader|x-access-token|helper' "$clone/.git/config"
